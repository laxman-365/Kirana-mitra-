# Sathi load balancer (nginx, free)
# file is included inside the http context, so map/upstream are valid here

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream sathi_backend {
    least_conn;
    server sathi-1:3000 max_fails=3 fail_timeout=15s;
    server sathi-2:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://sathi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /healthz {
        proxy_pass http://sathi_backend;
    }
}
